# .github/workflows/daily-facebook-post.yml
#
# Automatically posts today's verse from tablespoonofgod.com to your Facebook Page.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   FB_PAGE_ID      — your Facebook Page's numeric ID
#   FB_ACCESS_TOKEN — your never-expiring Page Access Token

name: Daily Facebook Post

on:
  schedule:
    # Runs every day at 8:00 AM Eastern Time (12:00 UTC)
    # Adjust the UTC hour to match your preferred posting time:
    #   7 AM ET  = 11:00 UTC  → cron: '0 11 * * *'
    #   8 AM ET  = 12:00 UTC  → cron: '0 12 * * *'
    #   9 AM ET  = 13:00 UTC  → cron: '0 13 * * *'
    - cron: '0 12 * * *'

  # Lets you trigger a test post manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post today's verse to Facebook
        run: node post_to_facebook.js
        env:
          FB_PAGE_ID:      ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
